# Dataset-specific Hesai preset; calibrate extrinsics and time offsets for your sensors.
common:
  lid_topic: /hesai/pandar
  imu_topic: /imu/si
  time_offset_lidar_to_imu: -36.89
  time_offset_from_lidar: 0.0
preprocess:
  scan_line: 32
  blind: 0.5
  lidar_type: 6
  max_scan_duration_s: 0.2
  header_time_tolerance_s: 0.002
mapping:
  acc_cov: 0.5
  gyr_cov: 0.5
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  fov_degree: 360
  det_range: 200.0
  extrinsic_est_en: false
  extrinsic_T:
  - 0
  - 0
  - 0.2
  extrinsic_R:
  - -0.99005
  - 0.14057
  - -0.0063
  - -0.14053
  - -0.99005
  - -0.0066
  - -0.00716
  - -0.00565
  - 0.99996
feature_extract_enable: false
point_filter_num: 3
max_iteration: 3
filter_size_surf: 0.5
filter_size_map: 0.5
cube_side_length: 1000
dense_map_enable: true
multisession_mode: 0
frontend_feedback_en: false

# Reproducible reference mode; async remains an explicit node option.
ikdtree_rebuild_mode: sync
